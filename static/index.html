<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogAtlas</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1b2938" id="theme-color-meta">
<link rel="stylesheet" href="/static/css/app.css">
<script>
  try { const t = localStorage.getItem('la-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#/">
      <img src="/static/icons/icon.svg" width="26" height="26" alt="">
      <span>LogAtlas</span>
    </a>
    <nav class="platforms" id="platforms" aria-label="Платформы"></nav>
    <div class="side-cases" id="side-cases"></div>
    <div class="side-foot">
      <button class="btn ghost small" id="theme-btn" type="button" title="Сменить тему">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3a7 7 0 1 0 7 7 5.5 5.5 0 0 1-7-7z" fill="currentColor"/></svg>
        <span>Тема</span>
      </button>
      <button class="btn ghost small" id="lang-btn" type="button" title="English / Русский">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="7.5"/><path d="M2.5 10h15M10 2.5c2.5 2 3.5 4.5 3.5 7.5S12.5 15.5 10 17.5c-2.5-2-3.5-4.5-3.5-7.5S7.5 4.5 10 2.5z"/></svg>
        <span id="lang-label">EN</span>
      </button>
      <span class="ver" id="ver"></span>
    </div>
  </aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-scrim" data-close></div>
  <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-body" id="drawer-body"></div>
  </section>
</div>
<div class="tooltip" id="tooltip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/vendor/d3-sankey.min.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
