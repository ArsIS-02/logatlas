# Готовый образ: docker compose pull && docker compose up -d
# Сборка из исходников:   docker compose up -d --build
services:
  logatlas:
    build:
      context: .
      args:
        LOGATLAS_UID: ${LOGATLAS_UID:-1000}
        LOGATLAS_GID: ${LOGATLAS_GID:-1000}
    image: ghcr.io/arsis-02/logatlas:${LOGATLAS_TAG:-latest}
    container_name: logatlas
    restart: unless-stopped
    # процесс работает от имени вашего пользователя, чтобы файлы в ./data принадлежали вам
    user: "${LOGATLAS_UID:-1000}:${LOGATLAS_GID:-1000}"
    ports:
      - "${LOGATLAS_PORT:-8484}:8484"
    volumes:
      # :Z — метка SELinux (в РЕД ОС SELinux обычно включён)
      - ./data:/data:Z
    environment:
      - TZ=UTC   # часовой пояс контейнера; на время в журналах не влияет
      - LOGATLAS_WORKERS=${LOGATLAS_WORKERS:-0}   # процессов разбора; 0 — по числу ядер
      # загрузка правил SigmaHQ с github.com: прокси, если выход в интернет только через него (задайте в .env)
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - LOGATLAS_SIGMA_UPDATE=${LOGATLAS_SIGMA_UPDATE:-1}   # 0 — без загрузки правил из сети
